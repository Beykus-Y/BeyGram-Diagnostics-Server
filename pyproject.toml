[project]
name = "beygram-report-server"
version = "1.0.0"
description = "Diagnostic bug-report intake for BeyGram (Telegram bot confirmation + HTTPS API + delivery worker)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
# Системный temp на этой машине недоступен для записи, поэтому базовый каталог
# тестов держим внутри проекта.
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
