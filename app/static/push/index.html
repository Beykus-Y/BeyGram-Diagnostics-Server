<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6357d9">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BeyGram">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>BeyGram</title>
  <link rel="manifest" href="/push/manifest.webmanifest?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/push/assets/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/push/assets/icons/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="/push/assets/css/push.css?v=2">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>BeyGram</h1>
      <p class="lead">BG Push · Уведомления на iPhone</p>
    </header>

    <p id="support" class="notice" hidden></p>

    <section class="card" aria-live="polite">
      <p class="label">Состояние</p>
      <p id="status" class="status">Проверяем…</p>
      <p id="detail" class="detail"></p>
    </section>

    <section id="pair" class="card" hidden>
      <label for="code" class="label">Код привязки из BeyGram</label>
      <input id="code" name="code" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="bgp1.…">
      <button id="enable" type="button" class="primary">Включить уведомления</button>
    </section>

    <section id="actions" class="card" hidden>
      <button id="test" type="button">Отправить тест</button>
      <button id="refresh" type="button">Обновить статус</button>
      <button id="disable" type="button" class="danger">Отключить на этом устройстве</button>
    </section>

    <section class="card">
      <label for="push-privacy" class="label">Содержимое уведомлений</label>
      <select id="push-privacy" disabled>
        <option value="full">Полный предпросмотр</option>
        <option value="name">Только имя или чат</option>
        <option value="none">Без содержимого</option>
      </select>
      <label for="push-language" class="label">Язык уведомлений</label>
      <select id="push-language" disabled>
        <option value="system">Системный</option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
      <button id="push-save-preferences" type="button" disabled>Сохранить настройки</button>
      <p id="push-local-result" class="detail"></p>
    </section>

    <p id="message" class="message" role="status"></p>
  </main>
  <script src="/push/assets/js/bg-core.js"></script>
  <script src="/push/assets/js/bg-store.js"></script>
  <script src="/push/assets/js/app.js"></script>
</body>
</html>
