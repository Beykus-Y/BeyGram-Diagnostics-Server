<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6357d9">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BG Push">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>BG Push</title>
  <link rel="manifest" href="/push/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/push/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/push/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/push/assets/css/push.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>BG Push</h1>
      <p class="lead">Уведомления BeyGram на iPhone</p>
    </header>

    <p id="support" class="notice" hidden></p>

    <section class="card" aria-live="polite">
      <p class="label">Состояние</p>
      <p id="status" class="status">Проверяем…</p>
      <p id="detail" class="detail"></p>
    </section>

    <section id="pair" class="card" hidden>
      <label for="code" class="label">Код привязки из BeyGram</label>
      <input id="code" name="code" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="bgp1.…">
      <button id="enable" type="button" class="primary">Включить уведомления</button>
    </section>

    <section id="actions" class="card" hidden>
      <button id="test" type="button">Отправить тест</button>
      <button id="refresh" type="button">Обновить статус</button>
      <button id="disable" type="button" class="danger">Отключить на этом устройстве</button>
    </section>

    <p id="message" class="message" role="status"></p>
  </main>
  <script src="/push/assets/js/bg-core.js"></script>
  <script src="/push/assets/js/bg-store.js"></script>
  <script src="/push/assets/js/app.js"></script>
</body>
</html>
